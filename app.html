<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAJNISH PRIME - BATCHES</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background-color: #080c14; 
            color: #ffffff; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .cards-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* CARD STYLE */
        .card {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
        }

        .card-desc {
            font-size: 0.88rem;
            color: #94a3b8;
            line-height: 1.4;
        }

        .batch-btn {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 12px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            transition: all 0.2s;
        }

        .batch-btn:active {
            transform: scale(0.96);
            background: rgba(16, 185, 129, 0.2);
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        /* POPUP OVERLAY STYLES */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .popup-card {
            background: #0d1520;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 28px 20px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            animation: popIn 0.25s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.88); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 14px; right: 14px;
            background: rgba(255,255,255,0.08);
            border: none;
            color: #94a3b8;
            width: 32px; height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }

        .popup-card h2 {
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            margin-top: 10px;
        }

        .popup-card p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .join-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-join {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-telegram {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        .btn-join:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <div class="cards-container">

        <!-- CARD 1 -->
        <div class="card">
            <div class="card-header">
                <img src="https://via.placeholder.com/60" class="card-icon" alt="PW">
                <h3 class="card-title">Physics Wallah</h3>
            </div>
            <p class="card-desc">Master Physics concepts with high-quality free lectures and notes.</p>
            <button class="batch-btn" onclick="handleBatchClick('batch1_page.html')">
                <span class="dot"></span> LIVE BATCHES AVAILABLE
            </button>
        </div>

        <!-- CARD 2 -->
        <div class="card">
            <div class="card-header">
                <img src="https://via.placeholder.com/60" class="card-icon" alt="NT">
                <h3 class="card-title">Next Toppers</h3>
            </div>
            <p class="card-desc">Crack competitive exams with high-quality free video lectures and notes.</p>
            <button class="batch-btn" onclick="handleBatchClick('batch2_page.html')">
                <span class="dot"></span> LIVE BATCHES AVAILABLE
            </button>
        </div>

    </div>

    <!-- POPUP MODAL FOR JOINING -->
    <div class="modal-overlay" id="communityModal">
        <div class="popup-card">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2>Join Community!</h2>
            <p>Instant access to notes, latest updates, and direct support.</p>
            
            <div class="join-options">
                <!-- TELEGRAM BUTTON -->
                <button class="btn-join btn-telegram" onclick="redirectAndUnlock('tg')">
                    JOIN TELEGRAM ✈️
                </button>
                
                <!-- WHATSAPP BUTTON -->
                <button class="btn-join btn-whatsapp" onclick="redirectAndUnlock('wa')">
                    JOIN WHATSAPP 💬
                </button>
            </div>
        </div>
    </div>

    <script>
        // AAPKE LINKS
        const telegramLink = 'https://t.me/+g0wmAK8VCGEwMTJl'; 
        const whatsappLink = 'https://whatsapp.com/channel/your_channel_id'; // Apna WhatsApp Channel Link Daalein

        let pendingTargetUrl = '';

        function handleBatchClick(targetUrl) {
            const isJoined = localStorage.getItem('userJoinedCommunity');

            if (isJoined === 'true') {
                // Agar pehle se join kar chuka hai, to direct target page khulega
                window.location.href = targetUrl;
            } else {
                // Agar join nahi kiya hai, to target page ko hold karke popup show karega
                pendingTargetUrl = targetUrl;
                document.getElementById('communityModal').style.display = 'flex';
            }
        }

        function redirectAndUnlock(platform) {
            // Memory me save kar dega ki join ho gaya
            localStorage.setItem('userJoinedCommunity', 'true');

            // Platform ke mutabiq link kholega
            if (platform === 'tg') {
                window.open(telegramLink, '_blank');
            } else if (platform === 'wa') {
                window.open(whatsappLink, '_blank');
            }

            // Popup band karega aur batch page par bhej dega
            closeModal();
            if (pendingTargetUrl) {
                setTimeout(() => {
                    window.location.href = pendingTargetUrl;
                }, 600);
            }
        }

        function closeModal() {
            document.getElementById('communityModal').style.display = 'none';
        }
    </script>

</body>
</html>
