<!DOCTYPE html>
<html lang="en">
<head>

    <title>Rajnish APK</title>

        .card { background: #111827; padding: 15px; border-radius: 15px; border: 1px solid #333; }
        .icon { width: 50px; height: 50px; border-radius: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <img src="https://i.ibb.co/1G34Y5z/profile.jpg" class="logo">
    <h1>Rajnish APK</h1>
    <p>Education Must Be Free</p>

    <div class="grid">
        <div class="card">
            <img src="https://cdn-icons-png.flaticon.com/128/3135/3135715.png" class="icon">
            <p>Next Topper</p>
        </div>
        <div class="card">
            <img src="https://cdn-icons-png.flaticon.com/128/3135/3135715.png" class="icon">
            <p>Mission Jeet</p>
        </div>
    </div>

</body>
</html>
