<!DOCTYPE html>
<html lang="en">
<head>

  <title>Rajnish APK</title>

    body { background-color: #0b0f19; color: #ffffff; font-family: sans-serif; text-align: center; padding: 30px 16px; }
    .main-logo { width: 95px; height: 95px; border-radius: 50%; object-fit: cover; border: 3px solid #f59e0b; margin-bottom: 14px; }
    .app-title { font-size: 28px; font-weight: 800; color: #f59e0b; margin-bottom: 20px; }

    .card { background: #111827; border-radius: 20px; padding: 20px 14px; border: 1px solid #333; }
    .card-icon { width: 64px; height: 64px; border-radius: 16px; object-fit: cover; margin-bottom: 12px; }
    .card-title { font-size: 16px; font-weight: 700; }
  </style>
</head>

  <header>
    <!-- Yeh raha aapka naya file name -->
    <img src="ChatGPT Image Aug 12, 2026, 08_08_06 AM.png" alt="Rajnish Profile" class="main-logo">
    <h1 class="app-title">Rajnish APK</h1>
  </header>

  <main class="grid-container">
    <a href="#" class="card">
      <img src="nt1.png" alt="Next Toppers" class="card-icon">
      <h3 class="card-title">Next Toppers</h3>
    </a>

    <a href="#" class="card">
      <img src="pw1.png" alt="Physics Wallah" class="card-icon">
      <h3 class="card-title">Physics Wallah</h3>
    </a>
  </main>

</body>
</html>
