<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAJNISH PRIME</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#080c14">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background-color: #080c14; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            padding: 24px;
            text-align: center;
        }

        .brand-title { 
            font-family: 'Syne', sans-serif;
            font-size: 3rem; 
            font-weight: 800; 
            margin-bottom: 35px; 
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .open-btn { 
            background: #6366f1; 
            color: #ffffff; 
            padding: 18px 48px; 
            font-size: 1.25rem; 
            font-weight: 700; 
            text-decoration: none; 
            border-radius: 18px; 
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.45); 
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-block;
            cursor: pointer;
            border: none;
        }

        .open-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .popup-card {
            background: #0d1520;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 32px 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 16px; right: 16px;
            background: rgba(255,255,255,0.08);
            border: none;
            color: #94a3b8;
            width: 32px; height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .popup-icon-box {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px auto;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35);
        }

        .popup-icon-box svg {
            width: 42px; height: 42px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .popup-card h2 {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .popup-card p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .btn-popup-join {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-popup-join:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <h1 class="brand-title">RAJNISH PRIME</h1>
    
    <button class="open-btn" onclick="handleOpenNow()">🔥 Open Now 🔥</button>

    <div class="modal-overlay" id="joinModal">
        <div class="popup-card">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div class="popup-icon-box">
                <svg viewBox="0 0 24 24">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
                </svg>
            </div>
            <h2>Join Community!</h2>
            <p>Instant access to notes, latest updates, and direct support.</p>
            <button class="btn-popup-join" onclick="joinTelegramAndUnlock()">
                JOIN TELEGRAM 
                <svg width="18" height="18" viewBox="0 0 24 24" style="stroke: #fff;">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const targetPage = 'app.html';
        const tgChannelLink = 'https://t.me/+g0wmAK8VCGEwMTJl';

        function handleOpenNow() {
            const hasJoined = localStorage.getItem('tgJoined');
            if (hasJoined === 'true') {
                window.location.href = targetPage;
            } else {
                document.getElementById('joinModal').style.display = 'flex';
            }
        }

        function joinTelegramAndUnlock() {
            window.open(tgChannelLink, '_blank');
            localStorage.setItem('tgJoined', 'true');
            closeModal();
            setTimeout(() => {
                window.location.href = targetPage;
            }, 500);
        }

        function closeModal() {
            document.getElementById('joinModal').style.display = 'none';
        }
    </script>

</body>
</html>
