<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAJNISH PRIME 2</title>
    
    <!-- Modern Font Setup -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background-color: #080c14; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            padding: 24px;
            text-align: center;
        }

        .brand-title { 
            font-family: 'Syne', sans-serif;
            font-size: 3rem; 
            font-weight: 800; 
            margin-bottom: 35px; 
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .open-btn { 
            background: #6366f1; 
            color: #ffffff; 
            padding: 18px 48px; 
            font-size: 1.25rem; 
            font-weight: 700; 
            text-decoration: none; 
            border-radius: 18px; 
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.45); 
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-block;
        }

        .open-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body>

    <h1 class="brand-title">RAJNISH PRIME</h1>
    <a href="app.html" class="open-btn">🔥 Open Now 🔥</a>

</body>
</html>
